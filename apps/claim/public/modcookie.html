<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModCookie</title>
    <meta name="description" content="Set cookies for passcode, blocking and version" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Source Code Pro", monospace;
        background-color: #070707;
        color: #ffffff;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 28rem;
        gap: 1.5rem;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }

      .label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #ffffff;
      }

      .input {
        height: 2.25rem;
        width: 100%;
        min-width: 0;
        border-radius: 0;
        border: 1px solid #252525;
        background-color: transparent;
        color: #ffffff;
        padding: 0.25rem 0.75rem;
        font-size: 0.875rem;
        outline: none;
        transition: all 0.2s;
      }

      .input:focus {
        border-color: #5937c6;
        box-shadow: 0 0 0 3px rgba(89, 55, 198, 0.2);
      }

      .input::placeholder {
        color: #999999;
      }

      .checkbox-group {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }

      .checkbox {
        height: 1rem;
        width: 1rem;
        border-radius: 0;
        border: 1px solid #252525;
        cursor: pointer;
      }

      .button {
        display: inline-flex;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
        border-radius: 0;
        font-size: 0.875rem;
        font-weight: 600;
        transition: all 0.2s;
        height: 2.75rem;
        padding: 0.5rem 1rem;
        background-color: #5937c6;
        color: #ffffff;
        border: none;
        text-decoration: none;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }

      .button:hover {
        background-color: #6535ff;
      }

      .button:disabled {
        pointer-events: none;
        cursor: not-allowed;
        opacity: 0.5;
      }

      @media (max-width: 640px) {
        .container {
          max-width: 100%;
          padding: 1rem;
        }

        body {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- App Field -->
      <div class="field-group">
        <label for="app" class="label">App:</label>
        <input type="text" id="app" class="input" placeholder="Enter app name" />
      </div>

      <!-- Branch Field -->
      <div class="field-group">
        <label for="branch" class="label">Branch:</label>
        <input type="text" id="branch" class="input" placeholder="Enter branch name" />
      </div>

      <!-- Password Field -->
      <div class="field-group">
        <label for="password" class="label">Password:</label>
        <input type="text" id="password" class="input" placeholder="Enter password" />
      </div>

      <!-- Blocking Field -->
      <div class="checkbox-group">
        <label for="blocking" class="label">Enable Blocking:</label>
        <input id="blocking" type="checkbox" class="checkbox" />
      </div>

      <a href="/" class="button" style="margin-top: 1rem"> Go to Home </a>
    </div>

    <script>
      // Helper function to get a specific cookie by name
      function getCookie(name) {
        if (typeof document === "undefined") return null
        const cookies = document.cookie.split(";")
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim()
          if (cookie && cookie.startsWith(name + "=")) {
            return decodeURIComponent(cookie.substring(name.length + 1))
          }
        }
        return null
      }

      // Helper function to set a cookie
      function setCookie(name, value, days) {
        let expires = ""
        if (days) {
          const date = new Date()
          date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000)
          expires = "; expires=" + date.toUTCString()
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/"
      }

      // Function to get URL parameters
      function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search)
        return urlParams.get(name)
      }

      // Function to save data
      function handleSaveData(fieldName, value) {
        const prefixedCookieName = "x-" + fieldName
        setCookie(prefixedCookieName, value, 7)
      }

      // Function to handle passcode saving
      function handlePasscodeSave() {
        const branchValue = document.getElementById("branch").value
        const appValue = document.getElementById("app").value
        const passwordValue = document.getElementById("password").value
        const combinedValue = branchValue + ":" + appValue + ":" + passwordValue
        handleSaveData("passcode", combinedValue)
      }

      // Function to handle blocking change
      function handleBlockingChange() {
        const blockingValue = document.getElementById("blocking").checked
        handleSaveData("blocking", blockingValue.toString())
      }

      // Initialize the page
      function initializePage() {
        // Read from query parameters first
        const branchFromQuery = getUrlParameter("branch")
        const appFromQuery = getUrlParameter("app")
        const passwordFromQuery = getUrlParameter("password")

        const branchInput = document.getElementById("branch")
        const appInput = document.getElementById("app")
        const passwordInput = document.getElementById("password")
        const blockingInput = document.getElementById("blocking")

        // Handle passcode field
        if (branchFromQuery || appFromQuery || passwordFromQuery) {
          // Priority: query params > cookies > defaults
          branchInput.value = branchFromQuery || ""
          appInput.value = appFromQuery || ""
          passwordInput.value = passwordFromQuery || ""
          // Save the query params to cookies
          const combinedValue =
            (branchFromQuery || "") + ":" + (appFromQuery || "") + ":" + (passwordFromQuery || "")
          setCookie("x-passcode", combinedValue, 7)
        } else {
          // Load from cookies
          const cookieVal = getCookie("x-passcode")
          if (cookieVal !== null && cookieVal !== undefined && cookieVal !== "") {
            const parts = cookieVal.split(":")
            branchInput.value = parts[0] || ""
            appInput.value = parts[1] || ""
            passwordInput.value = parts[2] || ""
          } else {
            branchInput.value = ""
            appInput.value = ""
            passwordInput.value = ""
          }
        }

        // Handle blocking field
        const blockingCookie = getCookie("x-blocking")
        if (blockingCookie !== null && blockingCookie !== undefined && blockingCookie !== "") {
          blockingInput.checked = blockingCookie === "true"
        } else {
          blockingInput.checked = false
        }

        // Add event listeners
        branchInput.addEventListener("blur", handlePasscodeSave)
        appInput.addEventListener("blur", handlePasscodeSave)
        passwordInput.addEventListener("blur", handlePasscodeSave)
        blockingInput.addEventListener("change", handleBlockingChange)
      }

      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", initializePage)
    </script>
  </body>
</html>
