# Fastdrop managed Pages workflow v1
name: Fastdrop Pages
on:
  push:
    branches: ["main"]
    paths: ["fastdrop.release.json"]
permissions:
  contents: read
concurrency:
  group: fastdrop-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/fastdrop-pages/build.ts
        env:
          VITE_ALCHEMY_API_KEY: ${{ vars.VITE_ALCHEMY_API_KEY }}
          VITE_WALLET_CONNECT_PROJECT_ID: ${{ vars.VITE_WALLET_CONNECT_PROJECT_ID }}
          VITE_SOLANA_RPC_URL: ${{ vars.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_WS_URL: ${{ vars.VITE_SOLANA_WS_URL }}
          VITE_FASTDROP_MODE: live
          VITE_TEST_MODE: 'false'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: apps/claim/dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
